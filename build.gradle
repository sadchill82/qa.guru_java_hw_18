plugins {
    id 'java-library'
    id("io.qameta.allure") version "2.12.0"
    id 'io.freefair.lombok' version '8.13.1'
}

allure {
    report {
        version.set("2.32.2")
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set("2.29.1")
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation (
            'com.codeborne:selenide:7.7.0',
            "org.junit.jupiter:junit-jupiter:5.12.2",
            "org.slf4j:slf4j-simple:2.0.17",
            'io.rest-assured:rest-assured:5.5.1',
            'io.rest-assured:json-schema-validator:5.5.1',
            'com.fasterxml.jackson.core:jackson-databind:2.18.3',
            'io.qameta.allure:allure-selenide:2.29.1',
            "io.qameta.allure:allure-junit5:2.29.1",
            "io.qameta.allure:allure-rest-assured:2.29.1",
            "org.assertj:assertj-core:3.27.3",
            "org.projectlombok:lombok:1.18.38"
    )
}

tasks.withType(Test) {
    systemProperties(System.getProperties())
    useJUnitPlatform()

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}